name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    name: Hub (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  games:
    name: Games (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install hub dependencies
        run: npm ci

      - name: Install game dependencies
        run: |
          for dir in games/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "::group::npm ci in $dir"
              (cd "$dir" && npm ci)
              echo "::endgroup::"
            fi
          done

      - name: Check every game
        run: npm run check:games

      - name: Build every game
        run: |
          for dir in games/*/; do
            if [ -f "$dir/package.json" ] && grep -q '"build"' "$dir/package.json"; then
              echo "::group::npm run build in $dir"
              (cd "$dir" && npm run build)
              echo "::endgroup::"
            fi
          done

      - name: Verify the committed build output is current
        run: |
          # The hub serves games/dist, so a stale committed bundle ships old code.
          STALE="$(git status --porcelain -- games | grep '/dist/' || true)"
          if [ -n "$STALE" ]; then
            echo "::error::Committed game build output is out of date. Rebuild the game and commit the result."
            echo "$STALE"
            exit 1
          fi
          echo "Game build output is up to date."

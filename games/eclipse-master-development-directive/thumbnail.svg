<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ECLIPSE: The Last Awakening">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040f"/>
      <stop offset="55%" stop-color="#0b1030"/>
      <stop offset="100%" stop-color="#16082e"/>
    </linearGradient>
    <radialGradient id="corona" cx="0.5" cy="0.5" r="0.5">
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="62%" stop-color="#fbbf24"/>
      <stop offset="72%" stop-color="#f97316" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38e8ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#void)"/>

  <g fill="#ffffff">
    <circle cx="100" cy="90" r="1.6" opacity="0.8"/><circle cx="260" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="430" cy="70" r="1.4" opacity="0.7"/><circle cx="780" cy="120" r="1.3" opacity="0.6"/>
    <circle cx="1090" cy="80" r="1.7" opacity="0.85"/><circle cx="1150" cy="200" r="1.2" opacity="0.5"/>
    <circle cx="180" cy="250" r="1.3" opacity="0.55"/><circle cx="980" cy="240" r="1.4" opacity="0.6"/>
    <circle cx="620" cy="60" r="1.2" opacity="0.5"/>
  </g>

  <!-- eclipse -->
  <circle cx="600" cy="250" r="180" fill="url(#corona)"/>
  <circle cx="600" cy="250" r="118" fill="#04060f"/>
  <circle cx="600" cy="250" r="118" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.9"/>
  <path d="M482 250 A118 118 0 0 1 600 132" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- light rays -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="600" y1="44" x2="600" y2="14"/>
    <line x1="747" y1="103" x2="772" y2="78"/>
    <line x1="453" y1="103" x2="428" y2="78"/>
    <line x1="794" y1="250" x2="826" y2="250"/>
    <line x1="406" y1="250" x2="374" y2="250"/>
  </g>

  <!-- floating shards / embers -->
  <g fill="#7c3aed" opacity="0.8">
    <polygon points="240,340 254,356 240,372 226,356"/>
    <polygon points="960,320 972,334 960,348 948,334" opacity="0.7"/>
    <polygon points="880,410 890,421 880,432 870,421" opacity="0.6"/>
    <polygon points="320,430 332,444 320,458 308,444" opacity="0.65"/>
  </g>
  <g fill="#38e8ff" opacity="0.7">
    <polygon points="180,470 190,481 180,492 170,481"/>
    <polygon points="1030,460 1040,471 1030,482 1020,471"/>
  </g>

  <!-- ground horizon -->
  <path d="M0 470 L300 440 L520 468 L760 436 L1000 464 L1200 442 L1200 630 L0 630 Z" fill="#05070f"/>
  <path d="M0 470 L300 440 L520 468 L760 436 L1000 464 L1200 442" fill="none" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="3"/>

  <!-- lone silhouette -->
  <g transform="translate(600 452)" fill="#000000">
    <circle cx="0" cy="-46" r="13"/>
    <path d="M-16 -30 L16 -30 L22 10 L-22 10 Z"/>
    <rect x="-20" y="8" width="15" height="34" rx="5"/>
    <rect x="5" y="8" width="15" height="34" rx="5"/>
  </g>
  <path d="M600 452 L600 496" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3"/>

  <text x="600" y="560" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="92" font-weight="bold" letter-spacing="22" fill="#f8fafc">ECLIPSE</text>
  <text x="600" y="602" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" letter-spacing="12" fill="#fbbf24">THE LAST AWAKENING</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="3"/>
</svg>

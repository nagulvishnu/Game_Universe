<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LAST DROP">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#7c2d12"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="isle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dusk)"/>

  <circle cx="600" cy="430" r="120" fill="#fde68a" opacity="0.9"/>
  <circle cx="600" cy="430" r="120" fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.6"/>

  <!-- clouds -->
  <g fill="#fef3c7" opacity="0.35">
    <ellipse cx="200" cy="170" rx="110" ry="34"/>
    <ellipse cx="290" cy="155" rx="80" ry="28"/>
    <ellipse cx="960" cy="140" rx="120" ry="32"/>
    <ellipse cx="870" cy="160" rx="70" ry="24"/>
    <ellipse cx="560" cy="120" rx="90" ry="24" opacity="0.7"/>
  </g>

  <!-- island below -->
  <ellipse cx="600" cy="640" rx="520" ry="150" fill="url(#isle)"/>
  <ellipse cx="600" cy="640" rx="520" ry="150" fill="none" stroke="#4ade80" stroke-opacity="0.5" stroke-width="4"/>
  <g fill="#0a1f10" opacity="0.85">
    <polygon points="380,570 430,520 480,570"/>
    <polygon points="700,560 760,505 820,560"/>
    <polygon points="540,585 590,540 640,585"/>
  </g>
  <g fill="#14532d">
    <rect x="660" y="540" width="40" height="40"/><rect x="710" y="525" width="34" height="55"/>
    <rect x="450" y="548" width="36" height="40"/>
  </g>

  <!-- supply crates on island -->
  <g transform="translate(880 560)">
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#b45309" stroke="#fbbf24" stroke-width="3"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- parachute drop (player) -->
  <g transform="translate(450 240)">
    <path d="M-110 0 A110 90 0 0 1 110 0 Z" fill="#e11d48"/>
    <path d="M-110 0 A110 90 0 0 1 110 0 Z" fill="none" stroke="#fecdd3" stroke-width="4"/>
    <path d="M-55 -78 A110 90 0 0 1 55 -78" fill="none" stroke="#fecdd3" stroke-width="4" opacity="0.8"/>
    <line x1="-110" y1="0" x2="-18" y2="96" stroke="#f8fafc" stroke-width="3"/>
    <line x1="110" y1="0" x2="18" y2="96" stroke="#f8fafc" stroke-width="3"/>
    <line x1="-58" y1="-74" x2="-10" y2="96" stroke="#f8fafc" stroke-width="2.5" opacity="0.8"/>
    <line x1="58" y1="-74" x2="10" y2="96" stroke="#f8fafc" stroke-width="2.5" opacity="0.8"/>
    <!-- diver -->
    <circle cx="0" cy="112" r="14" fill="#0f172a"/>
    <path d="M-16 126 L16 126 L22 170 L-22 170 Z" fill="#0f172a"/>
    <rect x="-30" y="130" width="16" height="40" rx="7" fill="#0f172a" transform="rotate(14 -30 130)"/>
    <rect x="14" y="130" width="16" height="40" rx="7" fill="#0f172a" transform="rotate(-14 14 130)"/>
    <rect x="-6" y="122" width="12" height="34" rx="5" fill="#38bdf8"/>
  </g>

  <!-- second distant drop -->
  <g transform="translate(830 210) scale(0.5)" opacity="0.75">
    <path d="M-110 0 A110 90 0 0 1 110 0 Z" fill="#0ea5e9"/>
    <line x1="-110" y1="0" x2="-14" y2="100" stroke="#f8fafc" stroke-width="4"/>
    <line x1="110" y1="0" x2="14" y2="100" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="0" cy="118" r="16" fill="#0f172a"/>
  </g>

  <!-- drop plane -->
  <g transform="translate(600 70)" fill="#e2e8f0">
    <ellipse cx="0" cy="0" rx="90" ry="16"/>
    <polygon points="-20,-4 -70,-34 -50,-34 -4,-6"/>
    <polygon points="-20,4 -70,34 -50,34 -4,6"/>
    <polygon points="84,0 110,-18 104,0 110,18"/>
    <rect x="-8" y="-4" width="14" height="8" rx="3" fill="#38bdf8"/>
  </g>

  <text x="600" y="530" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="92" font-weight="bold" letter-spacing="16" fill="#ffffff">LAST DROP</text>
  <text x="600" y="574" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" letter-spacing="12" fill="#fef3c7">ANIME BATTLE ROYALE</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#f97316" stroke-opacity="0.55" stroke-width="3"/>
</svg>

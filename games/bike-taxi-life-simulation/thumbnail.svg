<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ride to Riches">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="head" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#night)"/>

  <!-- neon buildings -->
  <g fill="#0b1224">
    <rect x="0" y="240" width="110" height="260"/><rect x="120" y="200" width="80" height="300"/>
    <rect x="215" y="270" width="120" height="230"/><rect x="350" y="180" width="90" height="320"/>
    <rect x="760" y="210" width="100" height="290"/><rect x="875" y="260" width="120" height="240"/>
    <rect x="1010" y="190" width="90" height="310"/><rect x="1110" y="250" width="90" height="250"/>
  </g>
  <g fill="#38e8ff" opacity="0.85">
    <rect x="20" y="265" width="14" height="18"/><rect x="48" y="265" width="14" height="18"/>
    <rect x="140" y="225" width="14" height="18"/><rect x="168" y="255" width="14" height="18"/>
    <rect x="370" y="205" width="14" height="18"/><rect x="398" y="240" width="14" height="18"/>
    <rect x="780" y="235" width="14" height="18"/><rect x="808" y="270" width="14" height="18"/>
    <rect x="1030" y="215" width="14" height="18"/><rect x="1058" y="250" width="14" height="18"/>
  </g>
  <g fill="#ff3df2" opacity="0.8">
    <rect x="240" y="295" width="14" height="18"/><rect x="268" y="330" width="14" height="18"/>
    <rect x="900" y="285" width="14" height="18"/><rect x="948" y="320" width="14" height="18"/>
    <rect x="1130" y="275" width="14" height="18"/><rect x="60" y="320" width="14" height="18"/>
  </g>

  <!-- neon signs -->
  <g font-family="Verdana, Geneva, sans-serif" font-weight="bold">
    <rect x="128" y="150" width="64" height="34" rx="6" fill="none" stroke="#ff3df2" stroke-width="3"/>
    <text x="160" y="174" text-anchor="middle" font-size="16" fill="#ff3df2">24/7</text>
    <rect x="1018" y="140" width="74" height="34" rx="6" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="1055" y="164" text-anchor="middle" font-size="16" fill="#4ade80">TAXI</text>
  </g>

  <!-- road -->
  <path d="M470 500 L560 340 L640 340 L730 500 Z" fill="url(#road)"/>
  <rect x="0" y="500" width="1200" height="130" fill="#0a0f1c"/>
  <g fill="#fde68a" opacity="0.9">
    <rect x="592" y="510" width="16" height="28" rx="4"/>
    <rect x="594" y="556" width="12" height="22" rx="4"/>
    <rect x="596" y="594" width="8" height="16" rx="3"/>
  </g>

  <!-- headlight cone -->
  <polygon points="470,430 260,540 560,540" fill="url(#head)" opacity="0.75"/>

  <!-- bike taxi -->
  <g transform="translate(560 430)">
    <!-- wheels -->
    <circle cx="-70" cy="52" r="34" fill="none" stroke="#0f172a" stroke-width="12"/>
    <circle cx="-70" cy="52" r="14" fill="#94a3b8"/>
    <circle cx="74" cy="52" r="34" fill="none" stroke="#0f172a" stroke-width="12"/>
    <circle cx="74" cy="52" r="14" fill="#94a3b8"/>
    <!-- frame -->
    <path d="M-70 52 L-10 6 L60 6 L74 52" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <path d="M-10 6 L-30 -14" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <!-- body / sidecar -->
    <rect x="-24" y="-30" width="86" height="40" rx="12" fill="#f59e0b"/>
    <rect x="-24" y="-30" width="86" height="14" rx="7" fill="#fbbf24"/>
    <!-- canopy -->
    <path d="M-18 -30 Q18 -66 56 -30 Z" fill="#38e8ff" opacity="0.9"/>
    <path d="M-18 -30 Q18 -66 56 -30 Z" fill="none" stroke="#e0f2fe" stroke-width="3"/>
    <!-- handlebar -->
    <path d="M-30 -14 L-46 -22" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <!-- headlight -->
    <circle cx="84" cy="10" r="10" fill="#fde68a"/>
    <!-- rider -->
    <circle cx="6" cy="-52" r="14" fill="#0f172a"/>
    <path d="M-8 -38 L20 -38 L24 -14 L-12 -14 Z" fill="#0f172a"/>
    <rect x="-24" y="-58" width="34" height="10" rx="5" fill="#f59e0b"/>
  </g>

  <!-- meter sign -->
  <g transform="translate(760 380)">
    <rect x="-34" y="-20" width="68" height="40" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="20" font-weight="bold" fill="#4ade80">$$</text>
  </g>

  <!-- floating cash -->
  <g font-family="Verdana, Geneva, sans-serif" font-weight="bold">
    <g transform="translate(320 300) rotate(-14)">
      <rect x="-30" y="-16" width="60" height="32" rx="5" fill="url(#cash)"/>
      <circle cx="0" cy="0" r="10" fill="#bbf7d0"/>
      <text x="0" y="6" text-anchor="middle" font-size="15" fill="#14532d">$</text>
    </g>
    <g transform="translate(880 260) rotate(12)">
      <rect x="-26" y="-14" width="52" height="28" rx="5" fill="url(#cash)"/>
      <circle cx="0" cy="0" r="9" fill="#bbf7d0"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" fill="#14532d">$</text>
    </g>
    <g transform="translate(240 400) rotate(8)" opacity="0.85">
      <rect x="-24" y="-13" width="48" height="26" rx="5" fill="url(#cash)"/>
      <circle cx="0" cy="0" r="8" fill="#bbf7d0"/>
    </g>
  </g>

  <text x="600" y="566" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="80" font-weight="bold" letter-spacing="10" fill="#f8fafc">RIDE TO RICHES</text>
  <text x="600" y="608" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" letter-spacing="12" fill="#4ade80">THE BIKE TAXI LIFE</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#38e8ff" stroke-opacity="0.45" stroke-width="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ShadowStrike">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0620"/>
      <stop offset="60%" stop-color="#1d0b38"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="70%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="880" cy="200" r="130" fill="url(#moon)" opacity="0.9"/>
  <g fill="#e9d5ff" opacity="0.7">
    <circle cx="160" cy="90" r="2"/><circle cx="320" cy="150" r="1.5"/><circle cx="520" cy="70" r="2"/>
    <circle cx="700" cy="120" r="1.5"/><circle cx="1050" cy="90" r="2"/><circle cx="1130" cy="180" r="1.5"/>
    <circle cx="240" cy="210" r="1.5"/><circle cx="980" cy="260" r="2"/>
  </g>

  <rect x="0" y="500" width="1200" height="130" fill="#05020c"/>
  <g stroke="#22d3ee" stroke-width="2" opacity="0.35">
    <line x1="0" y1="520" x2="1200" y2="520"/>
  </g>

  <!-- slash arc -->
  <path d="M430 300 Q600 180 780 320" stroke="url(#slash)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- left fighter (attacking, leaping) -->
  <g fill="#0a0a12" stroke="#0a0a12" stroke-linecap="round">
    <circle cx="470" cy="288" r="18"/>
    <line x1="470" y1="306" x2="455" y2="380" stroke-width="14"/>
    <line x1="455" y1="380" x2="420" y2="440" stroke-width="11"/>
    <line x1="455" y1="380" x2="500" y2="430" stroke-width="11"/>
    <line x1="470" y1="320" x2="540" y2="300" stroke-width="11"/>
    <line x1="470" y1="322" x2="430" y2="350" stroke-width="10"/>
  </g>
  <line x1="540" y1="300" x2="660" y2="255" stroke="url(#blade)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="660" cy="255" r="5" fill="#67e8f9"/>

  <!-- right fighter (recoiling) -->
  <g fill="#12081f" stroke="#12081f" stroke-linecap="round">
    <circle cx="760" cy="310" r="18"/>
    <line x1="760" y1="328" x2="775" y2="395" stroke-width="14"/>
    <line x1="775" y1="395" x2="750" y2="455" stroke-width="11"/>
    <line x1="775" y1="395" x2="815" y2="445" stroke-width="11"/>
    <line x1="760" y1="340" x2="700" y2="355" stroke-width="11"/>
    <line x1="760" y1="342" x2="805" y2="370" stroke-width="10"/>
  </g>
  <g fill="#f43f5e" opacity="0.9">
    <circle cx="706" cy="300" r="4"/><circle cx="722" cy="285" r="3"/><circle cx="690" cy="315" r="2.5"/>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="74" font-weight="bold" letter-spacing="8" fill="#f5f3ff">SHADOW</text>
  <text x="600" y="610" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="44" font-weight="bold" letter-spacing="16" fill="#22d3ee">STRIKE</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="3"/>
</svg>

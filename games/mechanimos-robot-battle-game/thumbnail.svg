<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MECHANIMOS">
  <defs>
    <linearGradient id="yard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1410"/>
      <stop offset="55%" stop-color="#3b2a17"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="mech" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="opt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#yard)"/>

  <!-- hazard stripes background band -->
  <g opacity="0.35">
    <rect x="0" y="470" width="1200" height="60"/>
    <g fill="#fbbf24">
      <polygon points="0,470 40,470 0,530"/><polygon points="80,470 120,470 40,530 0,530"/>
      <polygon points="160,470 200,470 120,530 80,530"/><polygon points="240,470 280,470 200,530 160,530"/>
      <polygon points="320,470 360,470 280,530 240,530"/><polygon points="400,470 440,470 360,530 320,530"/>
      <polygon points="480,470 520,470 440,530 400,530"/><polygon points="560,470 600,470 520,530 480,530"/>
      <polygon points="640,470 680,470 600,530 560,530"/><polygon points="720,470 760,470 680,530 640,530"/>
      <polygon points="800,470 840,470 760,530 720,530"/><polygon points="880,470 920,470 840,530 800,530"/>
      <polygon points="960,470 1000,470 920,530 880,530"/><polygon points="1040,470 1080,470 1000,530 960,530"/>
      <polygon points="1120,470 1160,470 1080,530 1040,530"/><polygon points="1200,470 1200,530 1160,530"/>
    </g>
    <g fill="#0c0a09">
      <polygon points="40,470 80,470 40,530"/><polygon points="120,470 160,470 80,530 40,530"/>
      <polygon points="200,470 240,470 160,530 120,530"/><polygon points="280,470 320,470 240,530 200,530"/>
      <polygon points="360,470 400,470 320,530 280,530"/><polygon points="440,470 480,470 400,530 360,530"/>
      <polygon points="520,470 560,470 480,530 440,530"/><polygon points="600,470 640,470 560,530 520,530"/>
      <polygon points="680,470 720,470 640,530 600,530"/><polygon points="760,470 800,470 720,530 680,530"/>
      <polygon points="840,470 880,470 800,530 760,530"/><polygon points="920,470 960,470 880,530 840,530"/>
      <polygon points="1000,470 1040,470 960,530 920,530"/><polygon points="1080,470 1120,470 1040,530 1000,530"/>
      <polygon points="1160,470 1200,470 1120,530 1080,530"/>
    </g>
  </g>

  <!-- giant robot (center-right) -->
  <g transform="translate(760 250)">
    <!-- legs -->
    <rect x="-64" y="130" width="44" height="110" rx="10" fill="#475569"/>
    <rect x="20" y="130" width="44" height="110" rx="10" fill="#475569"/>
    <rect x="-76" y="230" width="66" height="26" rx="8" fill="#334155"/>
    <rect x="10" y="230" width="66" height="26" rx="8" fill="#334155"/>
    <!-- torso -->
    <rect x="-80" y="10" width="160" height="130" rx="18" fill="url(#mech)"/>
    <rect x="-80" y="10" width="160" height="26" rx="13" fill="#94a3b8"/>
    <!-- chest core -->
    <circle cx="0" cy="82" r="30" fill="#0c4a6e"/>
    <circle cx="0" cy="82" r="30" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="0" cy="82" r="14" fill="#7dd3fc"/>
    <!-- shoulders -->
    <rect x="-130" y="0" width="56" height="70" rx="14" fill="#64748b"/>
    <rect x="74" y="0" width="56" height="70" rx="14" fill="#64748b"/>
    <!-- arms -->
    <rect x="-126" y="66" width="40" height="96" rx="12" fill="#475569"/>
    <rect x="86" y="66" width="40" height="96" rx="12" fill="#475569"/>
    <rect x="-134" y="156" width="56" height="36" rx="10" fill="#334155"/>
    <rect x="78" y="156" width="56" height="36" rx="10" fill="#334155"/>
    <!-- head -->
    <rect x="-40" y="-56" width="80" height="66" rx="14" fill="#e2e8f0"/>
    <rect x="-40" y="-56" width="80" height="20" rx="10" fill="#cbd5e1"/>
    <!-- visor -->
    <rect x="-28" y="-34" width="56" height="22" rx="8" fill="url(#opt)"/>
    <!-- antenna -->
    <line x1="24" y1="-56" x2="40" y2="-88" stroke="#f97316" stroke-width="5"/>
    <circle cx="42" cy="-92" r="7" fill="#f97316"/>
    <!-- panel lines -->
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="-58" y1="52" x2="-24" y2="52"/><line x1="24" y1="52" x2="58" y2="52"/>
      <line x1="-58" y1="118" x2="58" y2="118"/>
    </g>
  </g>

  <!-- tiny cars fleeing (left) -->
  <g transform="translate(240 420)">
    <!-- car 1 -->
    <g transform="translate(0 0)">
      <rect x="-56" y="-30" width="112" height="38" rx="12" fill="#ef4444"/>
      <path d="M-34 -30 Q-14 -56 26 -50 L40 -30 Z" fill="#f87171"/>
      <rect x="-16" y="-48" width="42" height="20" rx="6" fill="#bae6fd"/>
      <circle cx="-32" cy="10" r="16" fill="#0f172a"/><circle cx="-32" cy="10" r="7" fill="#94a3b8"/>
      <circle cx="34" cy="10" r="16" fill="#0f172a"/><circle cx="34" cy="10" r="7" fill="#94a3b8"/>
      <!-- eyes (panicked) -->
      <circle cx="-6" cy="-14" r="7" fill="#ffffff"/><circle cx="14" cy="-14" r="7" fill="#ffffff"/>
      <circle cx="-4" cy="-13" r="3.5" fill="#0f172a"/><circle cx="16" cy="-13" r="3.5" fill="#0f172a"/>
    </g>
    <!-- car 2 smaller, behind -->
    <g transform="translate(150 -34) scale(0.72)">
      <rect x="-56" y="-30" width="112" height="38" rx="12" fill="#38bdf8"/>
      <path d="M-34 -30 Q-14 -56 26 -50 L40 -30 Z" fill="#7dd3fc"/>
      <rect x="-16" y="-48" width="42" height="20" rx="6" fill="#e0f2fe"/>
      <circle cx="-32" cy="10" r="16" fill="#0f172a"/><circle cx="-32" cy="10" r="7" fill="#94a3b8"/>
      <circle cx="34" cy="10" r="16" fill="#0f172a"/><circle cx="34" cy="10" r="7" fill="#94a3b8"/>
      <circle cx="-6" cy="-14" r="7" fill="#ffffff"/><circle cx="14" cy="-14" r="7" fill="#ffffff"/>
      <circle cx="-4" cy="-13" r="3.5" fill="#0f172a"/><circle cx="16" cy="-13" r="3.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- dust puffs -->
  <g fill="#d6b98c" opacity="0.55">
    <ellipse cx="120" cy="452" rx="40" ry="16"/>
    <ellipse cx="70" cy="440" rx="26" ry="12"/>
    <ellipse cx="440" cy="456" rx="34" ry="14"/>
  </g>

  <!-- sparks near mech feet -->
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="660" y1="486" x2="646" y2="466"/>
    <line x1="686" y1="492" x2="700" y2="472"/>
    <line x1="850" y1="488" x2="866" y2="470"/>
  </g>

  <text x="600" y="566" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="88" font-weight="bold" letter-spacing="14" fill="#f8fafc">MECHANIMOS</text>
  <text x="600" y="610" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" letter-spacing="10" fill="#fbbf24">TINY CARS · GIANT ROBOTS</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3"/>
</svg>

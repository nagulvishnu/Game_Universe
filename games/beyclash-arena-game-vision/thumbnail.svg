<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Beyclash Arena">
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10061f"/>
      <stop offset="55%" stop-color="#2a0a3d"/>
      <stop offset="100%" stop-color="#0a0416"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0%" stop-color="#3b1160"/>
      <stop offset="60%" stop-color="#1d0a33"/>
      <stop offset="100%" stop-color="#0c0518"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#ffe14d"/>
      <stop offset="55%" stop-color="#ff8a2d"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38e8ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#arena)"/>

  <g fill="#ffffff">
    <circle cx="140" cy="80" r="1.5" opacity="0.7"/><circle cx="380" cy="60" r="1.3" opacity="0.6"/>
    <circle cx="700" cy="90" r="1.6" opacity="0.8"/><circle cx="1040" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="1150" cy="140" r="1.2" opacity="0.5"/><circle cx="90" cy="180" r="1.2" opacity="0.5"/>
  </g>

  <!-- stadium crowd lights -->
  <g fill="#ff3df2" opacity="0.55">
    <circle cx="150" cy="230" r="5"/><circle cx="185" cy="215" r="4"/><circle cx="220" cy="230" r="5"/>
    <circle cx="980" cy="230" r="5"/><circle cx="1015" cy="215" r="4"/><circle cx="1050" cy="230" r="5"/>
  </g>
  <g fill="#38e8ff" opacity="0.55">
    <circle cx="255" cy="215" r="4"/><circle cx="945" cy="215" r="4"/>
  </g>

  <!-- stadium bowl -->
  <ellipse cx="600" cy="400" rx="470" ry="165" fill="url(#dish)"/>
  <ellipse cx="600" cy="400" rx="470" ry="165" fill="none" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="6"/>
  <ellipse cx="600" cy="400" rx="350" ry="120" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="4"/>
  <ellipse cx="600" cy="400" rx="230" ry="76" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="3"/>

  <!-- motion arcs -->
  <path d="M260 380 A340 120 0 0 1 560 288" stroke="url(#arc)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M940 420 A340 120 0 0 0 700 480" stroke="#ff3df2" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- sparking top (center) -->
  <g transform="translate(600 372)">
    <ellipse cx="0" cy="46" rx="92" ry="26" fill="#000000" opacity="0.45"/>
    <ellipse cx="0" cy="30" rx="84" ry="30" fill="url(#core)"/>
    <ellipse cx="0" cy="18" rx="60" ry="24" fill="#ffe14d"/>
    <rect x="-10" y="-34" width="20" height="46" rx="8" fill="#f8fafc"/>
    <ellipse cx="0" cy="-36" rx="34" ry="14" fill="#e2e8f0"/>
    <ellipse cx="0" cy="-38" rx="34" ry="14" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <path d="M-84 30 A84 30 0 0 0 84 30" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4"/>
  </g>

  <!-- clash sparks -->
  <g stroke="#ffe14d" stroke-width="5" stroke-linecap="round">
    <line x1="600" y1="300" x2="600" y2="262"/>
    <line x1="546" y1="318" x2="522" y2="288"/>
    <line x1="654" y1="318" x2="678" y2="288"/>
    <line x1="512" y1="360" x2="476" y2="346"/>
    <line x1="688" y1="360" x2="724" y2="346"/>
  </g>

  <text x="600" y="548" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="80" font-weight="bold" letter-spacing="10" fill="#f8fafc">BEYCLASH ARENA</text>
  <text x="600" y="592" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" letter-spacing="12" fill="#ffe14d">SPIN · CLASH · CONQUER</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="3"/>
</svg>

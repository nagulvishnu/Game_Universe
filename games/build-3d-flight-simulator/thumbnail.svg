<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SKYBOUND: Flight Simulator">
  <defs>
    <linearGradient id="high" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e5b"/>
      <stop offset="45%" stop-color="#1d63d1"/>
      <stop offset="100%" stop-color="#9fd0ff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="contrail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#high)"/>

  <!-- sun -->
  <circle cx="980" cy="130" r="60" fill="#fef9c3" opacity="0.95"/>
  <circle cx="980" cy="130" r="90" fill="#fef9c3" opacity="0.25"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <ellipse cx="180" cy="200" rx="120" ry="38" opacity="0.9"/>
    <ellipse cx="280" cy="182" rx="80" ry="30" opacity="0.9"/>
    <ellipse cx="110" cy="214" rx="70" ry="26" opacity="0.85"/>
    <ellipse cx="1020" cy="330" rx="130" ry="40" opacity="0.85"/>
    <ellipse cx="920" cy="350" rx="80" ry="28" opacity="0.8"/>
    <ellipse cx="560" cy="470" rx="170" ry="46" opacity="0.9"/>
    <ellipse cx="700" cy="486" rx="110" ry="34" opacity="0.85"/>
    <ellipse cx="430" cy="494" rx="90" ry="30" opacity="0.85"/>
    <ellipse cx="80" cy="440" rx="100" ry="32" opacity="0.8"/>
    <ellipse cx="1140" cy="470" rx="110" ry="34" opacity="0.8"/>
  </g>

  <!-- contrails -->
  <g stroke="url(#contrail)" stroke-width="10" stroke-linecap="round">
    <line x1="520" y1="268" x2="140" y2="300"/>
    <line x1="540" y1="292" x2="220" y2="340"/>
  </g>

  <!-- airliner -->
  <g transform="translate(660 270) rotate(-10)">
    <!-- fuselage -->
    <ellipse cx="0" cy="0" rx="180" ry="26" fill="url(#wing)"/>
    <path d="M180 0 Q214 -6 220 0 Q214 8 180 4 Z" fill="#e2e8f0"/>
    <!-- windows -->
    <g fill="#0b1e5b">
      <circle cx="-120" cy="-4" r="4"/><circle cx="-100" cy="-4" r="4"/><circle cx="-80" cy="-4" r="4"/>
      <circle cx="-60" cy="-4" r="4"/><circle cx="-40" cy="-4" r="4"/><circle cx="-20" cy="-4" r="4"/>
      <circle cx="0" cy="-4" r="4"/><circle cx="20" cy="-4" r="4"/><circle cx="40" cy="-4" r="4"/>
      <circle cx="60" cy="-4" r="4"/><circle cx="80" cy="-4" r="4"/>
    </g>
    <path d="M120 -14 L168 -12 L168 -2 L126 -4 Z" fill="#38bdf8"/>
    <!-- wings -->
    <polygon points="-30,6 -130,74 -96,74 10,14" fill="#cbd5e1"/>
    <polygon points="-30,-6 -130,-70 -96,-70 10,-12" fill="#e2e8f0"/>
    <!-- engines -->
    <ellipse cx="-86" cy="52" rx="24" ry="11" fill="#64748b"/>
    <ellipse cx="-86" cy="-50" rx="24" ry="11" fill="#94a3b8"/>
    <!-- tail -->
    <polygon points="-160,0 -196,-52 -172,-52 -146,-6" fill="#1d63d1"/>
    <polygon points="-164,4 -196,44 -176,44 -150,8" fill="#1e40af"/>
    <!-- nose -->
    <ellipse cx="176" cy="0" rx="18" ry="16" fill="#e2e8f0"/>
  </g>

  <!-- small jets in formation -->
  <g fill="#e2e8f0" opacity="0.9" transform="translate(300 120) rotate(-8) scale(0.5)">
    <ellipse cx="0" cy="0" rx="70" ry="12"/>
    <polygon points="-10,4 -50,30 -34,30 4,8"/>
    <polygon points="-10,-4 -50,-28 -34,-28 4,-8"/>
    <polygon points="-60,0 -84,-22 -74,-22 -52,-2"/>
  </g>
  <g fill="#e2e8f0" opacity="0.75" transform="translate(400 90) rotate(-8) scale(0.4)">
    <ellipse cx="0" cy="0" rx="70" ry="12"/>
    <polygon points="-10,4 -50,30 -34,30 4,8"/>
    <polygon points="-10,-4 -50,-28 -34,-28 4,-8"/>
    <polygon points="-60,0 -84,-22 -74,-22 -52,-2"/>
  </g>

  <!-- HUD reticle -->
  <g stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.85">
    <circle cx="600" cy="315" r="46"/>
    <line x1="600" y1="253" x2="600" y2="273"/>
    <line x1="600" y1="357" x2="600" y2="377"/>
    <line x1="538" y1="315" x2="558" y2="315"/>
    <line x1="642" y1="315" x2="662" y2="315"/>
    <circle cx="600" cy="315" r="4" fill="#7dd3fc"/>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="92" font-weight="bold" letter-spacing="16" fill="#ffffff">SKYBOUND</text>
  <text x="600" y="604" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" letter-spacing="12" fill="#0b1e5b">FLIGHT SIMULATOR</text>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1d63d1" stroke-opacity="0.6" stroke-width="3"/>
</svg>
